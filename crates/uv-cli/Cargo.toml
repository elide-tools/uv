[package]
name = "uv-cli"
version = "0.0.48"
description = "This is an internal component crate of uv"
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
uv-audit = { workspace = true, features = ["clap"], optional = true }
uv-auth = { workspace = true }
uv-cache = { workspace = true, features = ["clap"] }
uv-configuration = { workspace = true, features = ["clap"] }
uv-distribution-types = { workspace = true }
uv-install-wheel = { workspace = true, features = ["clap"], default-features = false }
uv-normalize = { workspace = true }
uv-pep508 = { workspace = true }
uv-preview = { workspace = true }
uv-pypi-types = { workspace = true }
uv-python = { workspace = true, features = ["clap", "schemars"]}
uv-redacted = { workspace = true }
uv-resolver = { workspace = true, features = ["clap"] }
uv-settings = { workspace = true, features = ["schemars"] }
uv-static = { workspace = true }
uv-torch = { workspace = true, features = ["clap"] }
uv-version = { workspace = true }
uv-warnings = { workspace = true }
uv-workspace = { workspace = true }

anstream = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "string"] }
clap_complete_command = { workspace = true }
serde = { workspace = true }
url = { workspace = true }

[dev-dependencies]
insta = { workspace = true }

[features]
default = []
self-update = ["self-commands"]
# Enable Python install/uninstall/pin/dir/update-shell CLI subcommands.
python-managed = []
# Enable `uv publish` subcommand.
publish = []
# Enable `uv tool` namespace.
tool = []
# Enable `uv audit` subcommand in the project namespace.
audit = ["dep:uv-audit"]
# Enable `uv init` subcommand in the project namespace.
init = []
# Enable `uv self` namespace (version + update).
self-commands = []
# Enable the `uv project` namespace (sync/lock/add/remove/tree/export/version/format).
project = []
# Enable `uv run` (and script execution). Separable from `project` so sync/lock
# can be reintroduced independently of run.
run = []
# Enable `uv pip` namespace (compile/sync/install/uninstall/freeze/list/show/tree/check).
pip = []
# Enable `uv python` namespace (find/list, plus python-managed gates managed installs).
python = []
# Enable `uv build` subcommand (frontend wheel/sdist build).
build = []
# Enable `uv venv` subcommand.
venv = []
# Enable `uv cache` namespace (clean/prune/dir/size) and the hidden `uv clean` alias.
cache = []
# Enable `uv auth` namespace (login/logout/token/dir/helper).
auth = []
# Enable `uv workspace` namespace (metadata/dir/list).
workspace = []

[build-dependencies]
uv-static = { workspace = true }
fs-err = { workspace = true }
