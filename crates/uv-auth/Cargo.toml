[package]
name = "uv-auth"
version = "0.0.80"
description = "This is an internal component crate of uv"
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[features]
default = []
# Enable native platform keyring backends. Embedders that only need
# plaintext/env/netrc auth can leave this off to avoid secret-service/zbus and
# platform credential-store dependencies.
native-keyring = [
    "uv-keyring/apple-native",
    "uv-keyring/secret-service",
    "uv-keyring/windows-native",
]
# Enable cloud object-store request signing for S3, GCS, and Azure endpoints.
cloud-auth = ["dep:reqsign"]

[dependencies]
uv-fs = { workspace = true }
uv-keyring = { workspace = true }
uv-netrc = { workspace = true }
uv-once-map = { workspace = true }
uv-preview = { workspace = true }
uv-redacted = { workspace = true }
uv-small-str = { workspace = true }
uv-state = { workspace = true }
uv-static = { workspace = true }
uv-warnings = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
fs-err = { workspace = true, features = ["tokio"] }
http = { workspace = true }
percent-encoding = { workspace = true }
reqsign = { workspace = true, optional = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
rustc-hash = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
