[package]
name = "uv"
version = "0.13.8"
description = "A Python package and project manager"
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
documentation = "https://docs.astral.sh/uv"
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
default-run = "uv"

[lints]
workspace = true

[dependencies]
uv-python-types = { workspace = true }
uv-python-interpreter = { workspace = true }
uv-auth = { workspace = true }
uv-bin-install = { workspace = true, optional = true }
uv-build-backend = { workspace = true, optional = true }
uv-build-commands = { workspace = true, optional = true }
uv-build-frontend = { workspace = true, optional = true }
uv-cache = { workspace = true }
uv-cache-info = { workspace = true }
uv-cli = { workspace = true }
uv-client = { workspace = true }
uv-command-support = { workspace = true }
uv-configuration = { workspace = true }
uv-console = { workspace = true }
uv-dispatch = { workspace = true }
uv-distribution = { workspace = true }
uv-distribution-types = { workspace = true }
uv-environment-operations = { workspace = true, optional = true }
uv-errors = { workspace = true }
uv-flags = { workspace = true }
uv-fs = { workspace = true }
uv-install-operations = { workspace = true }
uv-install-wheel = { workspace = true, default-features = false }
uv-installer = { workspace = true }
uv-lock = { workspace = true }
uv-lock-operations = { workspace = true, optional = true }
uv-logging = { workspace = true, optional = true }
uv-normalize = { workspace = true }
uv-pep440 = { workspace = true }
uv-pep508 = { workspace = true }
uv-performance-memory-allocator = { workspace = true, optional = true }
uv-pip-commands = { workspace = true, optional = true }
uv-preview = { workspace = true }
uv-project-commands = { workspace = true, optional = true }
uv-publish-commands = { workspace = true, optional = true }
uv-pypi-types = { workspace = true }
uv-python-discovery = { workspace = true }
uv-python-commands = { workspace = true, optional = true }
uv-redacted = { workspace = true }
uv-requirements = { workspace = true }
uv-requirements-txt = { workspace = true }
uv-resolve-operations = { workspace = true }
uv-resolver = { workspace = true }
uv-scripts = { workspace = true }
uv-settings = { workspace = true }
uv-shell = { workspace = true }
uv-static = { workspace = true }
uv-test = { workspace = true, optional = true }
uv-threads = { workspace = true }
uv-tool-commands = { workspace = true, optional = true }
uv-types = { workspace = true }
uv-version = { workspace = true }
uv-virtualenv = { workspace = true, optional = true }
uv-warnings = { workspace = true }
uv-workspace = { workspace = true }
uv-workspace-commands = { workspace = true, optional = true }

anstream = { workspace = true }
anyhow = { workspace = true }
axoupdater = { workspace = true, features = [
  "github_releases",
  "tokio",
], optional = true }
clap = { workspace = true, features = ["derive", "string", "wrap_help"] }
console = { workspace = true }
diskus = { workspace = true, optional = true }
etcetera = { workspace = true }
fs-err = { workspace = true, features = ["tokio"] }
futures = { workspace = true }
http = { workspace = true }
indicatif = { workspace = true }
itertools = { workspace = true }
owo-colors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
textwrap = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-durations-export = { workspace = true, features = ["plot"], optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "registry"] }
tracing-tree = { workspace = true, optional = true }
walkdir = { workspace = true }
which = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
self-replace = { workspace = true }
uv-windows = { workspace = true }

[build-dependencies]
uv-static = { workspace = true }
uv-version = { workspace = true }

embed-manifest = { workspace = true }

[dev-dependencies]
uv-python-managed = { workspace = true }
uv-cache-key = { workspace = true }
uv-extract = { workspace = true }
uv-platform = { workspace = true }
uv-publish = { workspace = true, features = ["test"] }
uv-test = { workspace = true }
uv-trampoline-builder = { workspace = true }

assert_cmd = { workspace = true }
assert_fs = { workspace = true }
async_zip = { workspace = true, features = ["zstd"] }
backon = { workspace = true }
byteorder = { workspace = true }
bytes = { workspace = true }
dunce = { workspace = true }
filetime = { workspace = true }
flate2 = { workspace = true, default-features = false }
hex = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
indoc = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
regex = { workspace = true, features = ["perf", "unicode"] }
reqwest = { workspace = true, default-features = false }
sha2 = { workspace = true }
tar-codec = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
wiremock = { workspace = true }

[target.'cfg(unix)'.dependencies]
uv-unix = { workspace = true }

[features]
default = [
  "performance",
  "test-defaults",
  "install-tracing-subscriber",
  "python-managed",
  "publish",
  "tool",
  "audit",
  "init",
  "self-commands",
  "pip",
  "python",
  "build",
  "venv",
  "cache",
  "auth",
  "workspace",
  "source-build",
  "project",
  "run",
]
native-auth = ["native-keyring"]
native-keyring = ["uv-auth/native-keyring"]
cloud-auth = ["uv-auth/cloud-auth"]

# Build source distributions (PEP 517) during resolution/installation. Disable
# (e.g. for a wheel-only embedding) so sdist installs refuse with a clear error.
source-build = ["uv-dispatch/source-build"]

# Enable Python installation management (uv python install/uninstall/pin/dir/update-shell).
# Disable to strip download-from-python-build-standalone while keeping Python discovery
# (uv python find/list, uv sync against existing venvs) intact.
python-managed = [
  "python",
  "uv-cli/python-managed",
  "uv-python-discovery/python-managed",
  "uv-python-commands?/python-managed",
]

# Enable `uv publish` and its command crate.
publish = ["dep:uv-publish-commands", "uv-cli/publish"]

# Enable the `uv tool` namespace and its command crate.
tool = [
  "dep:uv-tool-commands",
  "dep:uv-environment-operations",
  "dep:uv-lock-operations",
  "dep:uv-virtualenv",
  "uv-cli/tool",
  "uv-pip-commands?/tool",
]

# Enable `uv audit`.
audit = ["project-commands", "uv-cli/audit"]

# Enable `uv init`.
init = ["project-commands", "uv-cli/init"]

# Enable the `uv project` namespace (sync/lock/add/remove/tree/export/version/format/check).
project = ["project-commands", "uv-cli/project"]

# Enable `uv run`. Implies `project`: `uv run` drives the project lock/sync machinery.
run = ["project-commands", "uv-cli/run", "project"]

# Shared by the project-namespace features: the project command crate and its operations.
project-commands = [
  "dep:uv-project-commands",
  "dep:uv-environment-operations",
  "dep:uv-lock-operations",
  "dep:uv-virtualenv",
]

# Enable the `uv pip` namespace.
pip = ["dep:uv-pip-commands", "uv-cli/pip"]

# Enable the `uv python` namespace (find/list always; managed installs need `python-managed`).
python = ["dep:uv-python-commands", "uv-cli/python"]

# Enable `uv build` (frontend wheel/sdist build) and the hidden build-backend entrypoint.
build = [
  "dep:uv-build-commands",
  "dep:uv-build-frontend",
  "dep:uv-build-backend",
  "uv-cli/build",
  "uv-workspace/build-backend",
  "source-build",
]

# Enable `uv venv`.
venv = [
  "dep:uv-environment-operations",
  "dep:uv-virtualenv",
  "uv-cli/venv",
]

# Enable the `uv cache` namespace and the hidden `uv clean` alias.
cache = ["dep:diskus", "uv-cli/cache"]

# Enable the `uv auth` namespace.
auth = ["uv-cli/auth"]

# Enable the `uv workspace` namespace.
workspace = [
  "dep:uv-workspace-commands",
  "dep:uv-environment-operations",
  "dep:uv-lock-operations",
  "uv-cli/workspace",
]

# Enable the `uv self` namespace (version + update).
self-commands = ["uv-cli/self-commands"]

# Install a global `tracing_subscriber` in `logging::setup_logging`. When disabled,
# tracing events still emit through the macros but no global subscriber is installed,
# so an embedder's subscriber receives them.
install-tracing-subscriber = ["dep:tracing-tree", "dep:uv-logging"]
# Use better memory allocators, etc.
performance = ["performance-memory-allocator"]
performance-memory-allocator = ["dep:uv-performance-memory-allocator"]

# Adds self-update functionality. This feature is only enabled for uv's cargo-dist installer
# and should be left unselected when building uv for package managers.
self-update = ["self-commands", "axoupdater", "dep:uv-bin-install", "uv-cli/self-update"]

# Features for development only.
tracing-durations-export = ["dep:tracing-durations-export", "uv-resolver/tracing-durations-export", "uv-settings/tracing-durations-export", "uv-test/tracing-durations-export"]

# Features that only apply when running tests, no-ops otherwise.
test-defaults = [
  "test-crates-io",
  "test-git",
  "test-git-lfs",
  "test-pypi",
  "test-r2",
  "test-python",
  "test-python-managed",
  "test-python-eol",
  "test-slow",
  "test-ecosystem",
  "test-universal"
]
# Introduces a testing dependency on crates.io.
test-crates-io = []
# Introduces a testing dependency on Git.
test-git = ["uv-test?/git"]
# Introduces a testing dependency on Git LFS.
test-git-lfs = ["test-git"]
# Introduces a testing dependency on PyPI.
test-pypi = ["uv-client/test-pypi"]
# Introduces a testing dependency on R2.
test-r2 = []
# Introduces a testing dependency on a local Python installation.
test-python = []
# Introduces a testing dependency on a local Python installation with specific patch versions.
test-python-patch = []
# Introduces a testing dependency on a local Python installation with an EOL version.
test-python-eol = []
# Introduces a testing dependency on managed Python installations.
test-python-managed = []
# Include "slow" test cases.
test-slow = []
# Includes test cases that require ecosystem packages
test-ecosystem = []
# Includes test cases for universal, platform-independent behavior.
test-universal = []
# Includes test cases that write to the Windows registry. These tests mutate
# global state (the Windows registry).
# We don't run these tests by default locally; the CI for Windows enables them.
test-windows-registry = []
# Build uvw binary on Windows
windows-gui-bin = []

[package.metadata.cargo-shear]
# The uv crate has uv-test as dev-dependency. We want that by default,
# uv runs tests with `uv-test/git`, so it's a default feature in uv. The
# problem is that uv-test is only a dev dependency, which gets stripped by
# `cargo install`, and `cargo install` fails with a missing crate error.
# As workaround, we make `uv-test` a regular optional dependency. It's never
# used as a regular dependency, but it allows using `uv-test?/git` as default
# feature.
# The uv-publish dev-dependency enables HTTP for trusted-publishing integration tests.
ignored = ["uv-publish", "uv-test"]

[package.metadata.dist]
dist = true

[[bin]]
name = "uvw"
required-features = ["windows-gui-bin"]

[lib]
doctest = false

[[test]]
name = "embedded_parse"
path = "tests/embedded_parse.rs"
harness = false
